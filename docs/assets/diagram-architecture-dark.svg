<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 446" width="1180" height="446" role="img" aria-label="The pieces of the project: core, runner, library and examples feed the page, the workers, the command line and the tests, and the build produces index.html, the documentation site and the npm package">
