<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 490" width="1180" height="490" role="img" aria-label="◇P across a partition: A partition looks exactly like a crash to the side that cannot hear.. heartbeats both ways; the network splits; A suspects everybody in B; B suspects everybody in A; the network heals; heartbeats resume, suspicions are withdrawn. No detector can tell a partition from a crash: the difference is only visible afterwards.">
  <rect width="1180" height="490" rx="14" fill="#ffffff"/>
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#56687a"/>
    </marker>
    <marker id="head-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2350a3"/>
    </marker>
    <marker id="head-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#0c7760"/>
    </marker>
    <marker id="head-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#c1283b"/>
    </marker>
  </defs>
  <text x="40" y="44" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#17283a" text-anchor="start">◇P across a partition</text>
  <text x="40" y="66" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#56687a" text-anchor="start">A partition looks exactly like a crash to the side that cannot hear.</text>
  <rect x="195" y="84" width="230" height="30" rx="8" fill="#f6f9fa" stroke="#2350a3" stroke-width="1.4"/>
  <text x="310" y="104" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#17283a" text-anchor="middle">side A</text>
  <line x1="310" y1="118" x2="310" y2="408" stroke="#dfe7eb" stroke-width="1.5"/>
  <rect x="515" y="84" width="230" height="30" rx="8" fill="#f6f9fa" stroke="#2350a3" stroke-width="1.4"/>
  <text x="630" y="104" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#17283a" text-anchor="middle">the network</text>
  <line x1="630" y1="118" x2="630" y2="408" stroke="#dfe7eb" stroke-width="1.5"/>
  <rect x="835" y="84" width="230" height="30" rx="8" fill="#f6f9fa" stroke="#2350a3" stroke-width="1.4"/>
  <text x="950" y="104" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#17283a" text-anchor="middle">side B</text>
  <line x1="950" y1="118" x2="950" y2="408" stroke="#dfe7eb" stroke-width="1.5"/>
  <path d="M314 142 L942 142" stroke="#2350a3" stroke-width="1.8" fill="none" marker-end="url(#head-blue)"/>
  <text x="630" y="134" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#17283a" text-anchor="middle">heartbeats both ways</text>
  <rect x="40" y="130" width="94" height="16" rx="8" fill="#fbeed8" opacity="0.55"/>
  <text x="87" y="146" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#17283a" text-anchor="middle">before</text>
  <path d="M630 180 q -34 0 -34 10 q 0 10 34 10" stroke="#c1283b" stroke-width="1.6" fill="none" marker-end="url(#head-red)"/>
  <text x="584" y="204" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#17283a" text-anchor="end">the network splits</text>
  <path d="M310 226 q 34 0 34 10 q 0 10 -34 10" stroke="#c1283b" stroke-width="1.6" fill="none" marker-end="url(#head-red)"/>
  <text x="356" y="250" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#17283a" text-anchor="start">A suspects everybody in B</text>
  <path d="M950 272 q -34 0 -34 10 q 0 10 34 10" stroke="#c1283b" stroke-width="1.6" fill="none" marker-end="url(#head-red)"/>
  <text x="904" y="296" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#17283a" text-anchor="end">B suspects everybody in A</text>
  <rect x="40" y="176" width="94" height="108" rx="8" fill="#fbeed8" opacity="0.55"/>
  <text x="87" y="238" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#17283a" text-anchor="middle">partition</text>
  <path d="M630 318 q -34 0 -34 10 q 0 10 34 10" stroke="#0c7760" stroke-width="1.6" fill="none" marker-end="url(#head-green)"/>
  <text x="584" y="342" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#17283a" text-anchor="end">the network heals</text>
  <path d="M314 372 L942 372" stroke="#0c7760" stroke-width="1.8" fill="none" marker-end="url(#head-green)"/>
  <text x="630" y="364" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#17283a" text-anchor="middle">heartbeats resume, suspicions are withdrawn</text>
  <rect x="40" y="314" width="94" height="62" rx="8" fill="#fbeed8" opacity="0.55"/>
  <text x="87" y="353" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#17283a" text-anchor="middle">after</text>
  <line x1="40" y1="446" x2="1140" y2="446" stroke="#c5d1d8" stroke-width="1" stroke-dasharray="4 5"/>
  <text x="40" y="468" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#17283a" text-anchor="start">No detector can tell a partition from a crash: the difference is only visible afterwards.</text>
  <text x="1140" y="468" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#56687a" text-anchor="end">both sides believe they are the survivors</text>
</svg>
