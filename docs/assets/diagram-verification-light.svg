<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 310" width="1180" height="310" role="img" aria-label="The verification loop: a scenario declares properties, a batch runs it over many seeds with random faults, a profile summarizes the conditions it survives, shrinking reduces a failing schedule, and the failing seed goes back into the page">
  <rect width="1180" height="310" rx="14" fill="#ffffff"/>
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#56687a"/>
    </marker>
    <marker id="head-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2350a3"/>
    </marker>
    <marker id="head-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#0c7760"/>
    </marker>
    <marker id="head-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#c1283b"/>
    </marker>
  </defs>
  <text x="40" y="44" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#17283a" text-anchor="start">From &quot;does it work?&quot; to &quot;here is the fault that breaks it&quot;</text>
  <text x="40" y="66" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#56687a" text-anchor="start">Every step is reproducible from a seed, in the page and on the command line.</text>
  <rect x="40" y="108" width="206" height="66" rx="10" fill="#f6f9fa" stroke="#2350a3" stroke-width="1.25"/>
  <rect x="40" y="108" width="4" height="66" rx="2" fill="#2350a3"/>
  <text x="143" y="138" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#17283a" text-anchor="middle">scenario</text>
  <text x="143" y="155" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#56687a" text-anchor="middle">code, topology, model</text>
  <path d="M250 141 L266 141" stroke="#56687a" stroke-width="1.8" fill="none" marker-end="url(#head)"/>
  <rect x="272" y="108" width="206" height="66" rx="10" fill="#f6f9fa" stroke="#6f42c1" stroke-width="1.25"/>
  <rect x="272" y="108" width="4" height="66" rx="2" fill="#6f42c1"/>
  <text x="375" y="138" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#17283a" text-anchor="middle">properties</text>
  <text x="375" y="155" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#56687a" text-anchor="middle">checked after every step</text>
  <path d="M482 141 L498 141" stroke="#56687a" stroke-width="1.8" fill="none" marker-end="url(#head)"/>
  <rect x="504" y="108" width="206" height="66" rx="10" fill="#f6f9fa" stroke="#6f42c1" stroke-width="1.25"/>
  <rect x="504" y="108" width="4" height="66" rx="2" fill="#6f42c1"/>
  <text x="607" y="138" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#17283a" text-anchor="middle">batch</text>
  <text x="607" y="155" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#56687a" text-anchor="middle">hundreds of seeds, faults drawn</text>
  <path d="M714 141 L730 141" stroke="#56687a" stroke-width="1.8" fill="none" marker-end="url(#head)"/>
  <rect x="736" y="108" width="206" height="66" rx="10" fill="#f6f9fa" stroke="#0c7760" stroke-width="2"/>
  <rect x="736" y="108" width="4" height="66" rx="2" fill="#0c7760"/>
  <text x="839" y="138" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#17283a" text-anchor="middle">profile</text>
  <text x="839" y="155" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#56687a" text-anchor="middle">one row per fault condition</text>
  <path d="M946 141 L962 141" stroke="#56687a" stroke-width="1.8" fill="none" marker-end="url(#head)"/>
  <rect x="968" y="108" width="206" height="66" rx="10" fill="#f6f9fa" stroke="#b36d0b" stroke-width="1.25"/>
  <rect x="968" y="108" width="4" height="66" rx="2" fill="#b36d0b"/>
  <text x="1071" y="138" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#17283a" text-anchor="middle">shrink</text>
  <text x="1071" y="155" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#56687a" text-anchor="middle">the faults that are enough</text>
  <path d="M1114 180 C 1114 220, 160 220, 160 182" stroke="#c1283b" stroke-width="1.8" fill="none" marker-end="url(#head-red)"/>
  <text x="627" y="248" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#c1283b" text-anchor="middle">open the seed, watch it happen, fix the algorithm</text>
</svg>
