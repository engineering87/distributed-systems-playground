name: CI

on:
  push:
    branches: [main]
  pull_request:

# the job only reads the repository
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
      - run: npm run check

  browser:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # every push is checked on Chromium; the other engines run on the main branch
        browser: ${{ github.ref == 'refs/heads/main' && fromJSON('["chromium","firefox","webkit"]') || fromJSON('["chromium"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install -r test/browser/requirements.txt
      - run: playwright install --with-deps ${{ matrix.browser }}
      - run: python test/browser/run_all.py
        env:
          DSP_BROWSER: ${{ matrix.browser }}

  commits:
    # the shape of the messages is what makes the changelog readable
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/check-commits.mjs --range ${{ github.event.pull_request.base.sha }}..HEAD
